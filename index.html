<script>
// ===== הדביקו כאן את הגדרות Firebase שלכם (ראו מדריך). אם ריק – האתר עובד עם שמירה מקומית בלבד =====
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDWUSJ7lQEEX5zOTgBqcBAq7zrekigugvg",
  authDomain: "tasks-d89e7.firebaseapp.com",
  projectId: "tasks-d89e7",
  appId: "1:1080634485493:web:ac90729902f41cd93e33bc"
};
// ===================================================================================================

let S = { cats: ["כללי"], tasks: [], courses: [] };
let editId = null, page = "tasks";
let tab = "day", picking = false, editing = false, ref = null;
const $ = id => document.getElementById(id);
const BOW = '<span class="bow" aria-hidden="true"><svg viewBox="0 0 60 34"><defs><linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="2" y1="0" x2="59" y2="0"><stop offset="0" stop-color="#E27F8B"/><stop offset=".55" stop-color="#EFA3A6"/><stop offset="1" stop-color="#F7C9C0"/></linearGradient></defs><g fill="none" stroke="url(#bg)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M30 12C22 7 12 3 7 7c-5 5-1 13 6 13 7 0 13-5 17-8z"/><path d="M30 12C36 6 46 2 53 5c6 4 2 11-6 12-7 1-13-2-17-5z"/><path d="M30 12C29 20 24 27 14 31.500"/><path d="M30 12C33 20 40 24 48 22c4-1 8-3 11-2"/></g><circle cx="30" cy="12" r="2.300" fill="#E27F8B"/></svg></span>';
const heSort = (a, b) => a.localeCompare(b, "he");
const byTitle = (a, b) => heSort(a.title, b.title);
function autoCat(title, sel) {
  const low = title.toLowerCase();
  for (const c of [...S.cats].sort((a, b) => b.length - a.length)) {
    const i = low.indexOf(c.toLowerCase());
    if (i >= 0 && (i === 0 || /\s/.test(title[i - 1]))) {
      const rest = (title.slice(0, i) + " " + title.slice(i + c.length)).replace(/\s+/g, " ").replace(/^[\s\-–—:,.]+|[\s\-–—:,.]+$/g, "");
      return { cat: c, title: rest || title };
    }
  }
  return { cat: sel, title };
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const todayStart = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const weekStart = () => { const d = todayStart(); d.setDate(d.getDate() - d.getDay()); return d; }; // ראשון
const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

// ---------- שמירה וטעינה ----------
let cloudReady = false; // לא כותבים לענן לפני שקראנו ממנו, כדי לא לדרוס נתונים
try { const l = localStorage.getItem("tasks-state"); if (l) S = JSON.parse(l); } catch (e) {}
ensure();
function saveLocal() { try { localStorage.setItem("tasks-state", JSON.stringify(S)); } catch (e) {} }
function save() {
  saveLocal();
  if (ref && cloudReady) ref.set(S).then(() => $("sync").textContent = "נשמר בענן ☁️").catch(() => $("sync").textContent = "שגיאת סנכרון – נשמר מקומית");
}
if (FIREBASE_CONFIG.projectId && window.firebase) {
  firebase.initializeApp(FIREBASE_CONFIG);
  ref = firebase.firestore().collection("app").doc("state");
  ref.onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites) return;
    const cloud = snap.exists ? snap.data() : null;
    const cloudCount = cloud && Array.isArray(cloud.tasks) ? cloud.tasks.length : 0;
    if (!cloudReady) {
      cloudReady = true;
      // הענן ריק או נמחק, אבל יש עותק מקומי בדפדפן – משחזרים אותו לענן
      if (cloudCount === 0 && S.tasks && S.tasks.length > 0 && !(cloud && Array.isArray(cloud.courses) && cloud.courses.length)) { ref.set(S); $("sync").textContent = "שוחזר לענן מהעותק המקומי ☁️"; render(); return; }
    }
    if (cloud && Array.isArray(cloud.tasks)) { S = cloud; ensure(); if (!Array.isArray(S.cats)) S.cats = ["כללי"]; saveLocal(); render(); }
    else if (!cloud) ref.set(S);
    $("sync").textContent = "מחובר לענן ☁️";
  }, () => $("sync").textContent = "אין חיבור לענן – עובד מקומית");
} else $("sync").textContent = "שמירה מקומית בלבד (Firebase לא הוגדר)";

// ---------- ציונים ----------
function ensure() { if (!Array.isArray(S.courses)) S.courses = []; S.courses.forEach(norm); }
function norm(c) {
  if (c.comps) return;
  const w = c.w || {}, n = c.n || {}; c.g = c.g || {}; c.d = c.d || { mid: "", final: "" };
  c.comps = [{ id: "final", kind: "final", name: "מבחן סוף/פרויקט", w: w.final || 0 },
    { id: "mid", kind: "mid", name: "מבחן אמצע", w: w.mid || 0, shield: !!c.shield },
    { id: "hw", kind: "list", name: "שיעורי בית", w: w.hw || 0, n: n.hw || 0, shield: false }];
  if ((w.proj || 0) > 0 || (c.g.proj || []).length) c.comps.push({ id: "proj", kind: "list", name: "פרויקטים/מעבדות", w: w.proj || 0, n: n.proj || 0, shield: false });
  c.g.hw = c.g.hw || []; delete c.w; delete c.n; delete c.shield;
}
const defaultComps = () => [{ id: "final", kind: "final", name: "מבחן סוף/פרויקט", w: 0 }, { id: "mid", kind: "mid", name: "מבחן אמצע", w: 0, shield: false }, { id: "hw", kind: "list", name: "שיעורי בית", w: 0, n: 0, shield: false }];
const r1 = x => Math.round(x * 10) / 10;
const topAvg = (a, n) => { if (!a || !a.length) return null; const t = [...a].sort((x, y) => y - x).slice(0, n > 0 ? n : a.length); return t.reduce((q, x) => q + x, 0) / t.length; };
const cavg = (c, k) => k.kind === "list" ? topAvg(c.g[k.id], k.n) : (c.g[k.id] ?? null);
// מגן: רכיב נספר רק אם ציון מבחן הסוף מעל 50 והממוצע שלו גבוה מציון מבחן הסוף. אחרת האחוזים עוברים למבחן הסוף
function eff(c) {
  const w = {}; c.comps.forEach(k => w[k.id] = k.w);
  const fin = c.g.final ?? null;
  if (fin != null) c.comps.forEach(k => {
    if (k.kind !== "final" && k.shield && k.w > 0) { const a = cavg(c, k); if (!(fin > 50 && a != null && a > fin)) { w.final += w[k.id]; w[k.id] = 0; } }
  });
  return w;
}
function current(c) {
  const w = eff(c); let t = 0, ws = 0;
  c.comps.forEach(k => { const a = cavg(c, k); if (w[k.id] > 0 && a != null) { t += a * w[k.id]; ws += w[k.id]; } });
  return ws ? { grade: t / ws, pct: ws } : null;
}
function courseCard(c) {

function isHot(t) { if (!t.due) return false; const diff = (new Date(t.due + "T00:00:00") - todayStart()) / 864e5; return diff < 2; }

// דחיפות לפי תאריך יעד בבחירת משימות: key = weekly (עד סוף השבוע) / daily (היום או מחר)
function urgency(t, key) {
  if (!t.due) return null;
  const d = Math.round((new Date(t.due + "T00:00:00") - todayStart()) / 864e5);
  const limit = key === "weekly" ? 6 - todayStart().getDay() : 0; // שבועי: עד סוף השבוע, יומי: היום (וגם באיחור)

  $("addc").onclick = () => { const v = $("nc2").value.trim(); if (v && !S.cats.includes(v)) { S.cats.push(v); S.cats.sort(heSort); save(); editCats(); } };
  $("back").onclick = render;
  document.querySelectorAll("[data-rc]").forEach(b => b.onclick = () => { if (confirm("למחוק את הקטגוריה? המשימות שלה יישארו.")) { S.cats.splice(+b.dataset.rc, 1); save(); editCats(); } });
}

// עדכון כשחוזרים לאפליקציה (יום/שבוע חדש)
document.addEventListener("visibilitychange", () => { if (!document.hidden && !editing) render(); });
render();
</script>
</body>
